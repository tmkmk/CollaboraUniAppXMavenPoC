plugins {
    id 'com.android.application'
}

android {
    namespace 'com.company.collabora.demo'
    compileSdk 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId 'com.company.collabora.demo'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'com.company.collabora:collabora-mobile-api:0.1.0-SNAPSHOT'
    implementation 'org.libreoffice:collabora-engine:0.1.0-poc'
}
